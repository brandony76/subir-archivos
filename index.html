<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f7f5">
    <title>Subir archivo | Archivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>
<body>
    <main class="container upload-shell py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7">
                <header class="page-heading mb-4">
                    <h1 class="display-title">Subí tu archivo</h1>
                    <p class="text-secondary mb-0">Guardalo de forma segura y encontralo cuando lo necesites.</p>
                </header>

                <section class="upload-panel" aria-labelledby="upload-title">
                    <div class="panel-topline"></div>
                    <div class="p-4 p-md-5">
                        <h2 id="upload-title" class="h4 mb-2">Elegí un archivo</h2>
                        <p class="text-secondary mb-4">Se aceptan imágenes y documentos PDF de hasta 5 MB.</p>

                        <form action="guardar.php" method="POST" enctype="multipart/form-data">
                            <label for="archivo" class="form-label fw-semibold">Archivo</label>
                            <input class="form-control form-control-lg file-input" type="file" id="archivo" name="archivo"
                                   accept="image/jpeg,image/png,image/gif,image/webp,application/pdf" required>
                            <div class="form-text mb-4">Formatos: JPG, PNG, GIF, WebP o PDF.</div>
                            <button class="btn btn-primary btn-lg w-100 upload-button" type="submit">
                                Subir archivo <span aria-hidden="true">&#8594;</span>
                            </button>
                        </form>
                    </div>
                    <div class="panel-footer px-4 px-md-5 py-3">
                        <span class="status-dot" aria-hidden="true"></span>
                
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
